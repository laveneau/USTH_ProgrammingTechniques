[project]
name = "autodiff"
version = "0.1.0"
description = "Week 1 project: forward- and reverse-mode automatic differentiation"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["mypy", "matplotlib"]

[tool.mypy]
strict = true
# Beyond --strict: the course forbids writing `Any` out by hand, so that a type the
# checker cannot verify has to be spelled as a real type rather than waved through.
disallow_any_explicit = true
files = ["autodiff"]
